name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chaque jour : détecte un changement de src/shared poussé dans blaito.
  schedule:
    - cron: '0 6 * * *'

jobs:
  shared:
    name: src/shared identique à blaito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-shared.mjs --check

  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format (Prettier)
        run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - run: pnpm build
      - name: Dépendances sans faille grave
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Tests de bout en bout (Playwright)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t laito-web .
