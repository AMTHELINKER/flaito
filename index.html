<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3E2A1E" />
    <meta
      name="description"
      content="Laito — un carnet d’écriture calme et élégant pour écrire, garder privé ou partager vos livres."
    />
    <title>Laito</title>
    <script>
      // Applique le thème avant le premier rendu (évite le flash).
      try {
        var t = localStorage.getItem('laito.theme');
        var dark = t === 'night' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = t || (dark ? 'night' : 'parchment');
        var fs = localStorage.getItem('laito.uiFontSize');
        if (fs) document.documentElement.style.fontSize = fs + 'px';
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Laito a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
